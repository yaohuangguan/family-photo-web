<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4eadb" />
  <meta name="description" content="属于我们一家人的温馨全家福。" />
  <title>我们的家 · 全家福</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="ambient ambient-left"></div>
  <div class="ambient ambient-right"></div>

  <main class="page-shell">
    <section class="hero" aria-labelledby="family-title">
      <p class="eyebrow">OUR FAMILY · 我们的家</p>
      <h1 id="family-title">家，是我们永远的合影</h1>
      <p class="subtitle">岁月会向前走，但一家人在一起的这一刻，会一直留在这里。</p>

      <div class="portrait-stage">
        <span class="tape tape-left" aria-hidden="true"></span>
        <span class="tape tape-right" aria-hidden="true"></span>
        <div class="frame" role="img" aria-label="一家人的全家福">
          <div class="frame-inner">
            <img src="./assets/family-photo.webp" alt="一家人的温馨全家福" />
          </div>
        </div>
      </div>

      <div class="note-card">
        <span class="heart" aria-hidden="true">♥</span>
        <p>愿我们常相见，常惦念，平安健康，笑容常在。</p>
        <span class="signature">— 我们一家人</span>
      </div>
    </section>
  </main>

  <footer>把普通的日子，过成值得珍藏的回忆。</footer>
</body>
</html>
